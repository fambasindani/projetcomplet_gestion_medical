# ============================================================================
# GS-HOPITAL - CONFIGURATION A REMPLIR (backend)
#
#   1. Ouvrir ce fichier avec le Bloc-notes
#   2. Verifier les valeurs ci-dessous (base, compte SQL, port)
#   3. Enregistrer (Fichier > Enregistrer)
#   4. Double-cliquer sur Installer-GS-Hopital.cmd
#
# Si des CHANGER_MOI subsistent, l'installateur posera les questions dans
# la console a la place de ce fichier.
# La cle jwt.secret est generee automatiquement : laissez la valeur
# CHANGER_MOI_GENERE_PAR_INSTALLATEUR telle quelle.
# ============================================================================

# --- 1. Base de donnees SQL Server ------------------------------------------
# localhost = SQL Server sur cette meme machine.
# Sinon : nom du serveur, hote\INSTANCE (ex. SRV-SQL\SQLEXPRESS) ou hote,port
spring.datasource.url=jdbc:sqlserver://192.168.88.115:1433;databaseName=GestionHospitaliereDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=hopital
spring.datasource.password=hopital+1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- 2. Reseau --------------------------------------------------------------
# 0.0.0.0   = joignable depuis le reseau local
# 127.0.0.1 = accessible uniquement depuis le serveur (derriere IIS/Apache)
server.address=0.0.0.0
server.port=7035

# --- 3. Parametres applicatifs (ne pas modifier) ----------------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

jwt.secret=CHANGER_MOI_GENERE_PAR_INSTALLATEUR
jwt.expiration=3600000
jwt.refresh-expiration=86400000

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chemin des journaux : ajuste automatiquement au dossier d'installation
logging.file.name=C:/apps/gs-hopital/backend/logs/backend.log
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
